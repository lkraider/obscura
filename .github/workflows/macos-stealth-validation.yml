name: macOS Stealth Validation

on:
  push:
    branches:
      - cloud-validation-stealth-4aea848

permissions:
  contents: read

jobs:
  build:
    name: Build patched render-stealth CLI
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout exact patched source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 4aea8489cba7cbff60390846cb06c78dda770c4c
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin

      - name: Configure macOS SDK and libclang
        shell: bash
        run: |
          XCODE_PATH="$(xcode-select -p)"
          SDK_PATH="$(xcrun --show-sdk-path)"
          echo "SDKROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-isystem $SDK_PATH/usr/include/c++/v1" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$XCODE_PATH/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      - name: Build patched render-stealth release
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
        run: >-
          cargo build --release --target aarch64-apple-darwin
          -p obscura-cli --bins --features render,stealth

      - name: Smoke test stealth runtime
        shell: bash
        run: |
          BIN=target/aarch64-apple-darwin/release/obscura
          "$BIN" --version
          "$BIN" fetch 'data:text/html,<title>ok</title>' --stealth --eval '1+1'

      - name: Stage artifact and manifest
        shell: bash
        run: |
          mkdir -p artifact
          cp target/aarch64-apple-darwin/release/obscura artifact/
          cd artifact
          shasum -a 256 obscura > obscura.sha256
          cat obscura.sha256

      - name: Upload patched render-stealth artifact
        uses: actions/upload-artifact@043fb46c729d4c45ff4d23a747c4c533fb31884a # v7
        with:
          name: obscura-cli-macos-arm64-4aea848-stealth
          path: |
            artifact/obscura
            artifact/obscura.sha256
          if-no-files-found: error
          retention-days: 2

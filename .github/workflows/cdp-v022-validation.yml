name: v0.2.2 CDP validation
on:
  push:
    branches: [cloud-validation-v0.2.2-cdp]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  OPENSSL_NO_VENDOR: "1"
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            revision: a1e09de68c7617b8079fbb1661b0548c501971c1
          - name: candidate
            revision: 20a3e0248150f2bf79357d89821450e483a97cb6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ matrix.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: h4ckf0r0day/obscura-benchmark
          ref: 6ebac8293d7477f59e837768bfd4e74173f04f1c
          path: obscura-benchmark
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake libclang-dev libssl-dev llvm-dev pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d
        with:
          tool: nextest
          fallback: none
      - name: Copy regression tests to baseline
        if: matrix.name == 'baseline'
        run: git show 20a3e0248150f2bf79357d89821450e483a97cb6:crates/obscura-cdp/tests/runtime_by_value_undefined.rs > crates/obscura-cdp/tests/runtime_by_value_undefined.rs
      - name: Focused render tests, red on baseline and green on candidate
        env:
          VARIANT: ${{ matrix.name }}
        run: |
          mkdir -p evidence
          set +e
          cargo nextest run --release --features render -p obscura-cdp --test runtime_by_value_undefined --no-fail-fast 2>&1 | tee evidence/focused-render.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$VARIANT" = baseline ]; then
            test "$code" = 100
            grep -q '4 failed' evidence/focused-render.log
          else
            test "$code" = 0
          fi
      - name: Full render suite
        continue-on-error: true
        run: cargo nextest run --release --features render --no-fail-fast -E 'not binary(runtime_by_value_undefined)' 2>&1 | tee evidence/full-render.log
      - name: Build render CLI
        run: cargo build --release -p obscura-cli --bins --features render
      - name: Obstacle course
        continue-on-error: true
        run: OBSCURA_BIN="$PWD/target/release/obscura" python3 obscura-benchmark/obstacle-course/run.py --json --runs 1 --warmup 0 > evidence/obstacle.json
      - name: Focused no-render tests
        env:
          VARIANT: ${{ matrix.name }}
        run: |
          set +e
          cargo nextest run --release --no-default-features -p obscura-cdp --test runtime_by_value_undefined --no-fail-fast 2>&1 | tee evidence/focused-no-render.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$VARIANT" = baseline ]; then
            test "$code" = 100
            grep -q '4 failed' evidence/focused-no-render.log
          else
            test "$code" = 0
          fi
      - name: Affected no-render suite
        continue-on-error: true
        run: cargo nextest run --release --no-default-features -p obscura-cdp -p obscura-js --no-fail-fast -E 'not binary(runtime_by_value_undefined)' 2>&1 | tee evidence/affected-no-render.log
      - name: Build no-render CLI
        run: cargo build --release -p obscura-cli --bins --no-default-features
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v022-cdp-${{ matrix.name }}
          path: evidence/
          retention-days: 7
  macos:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 20a3e0248150f2bf79357d89821450e483a97cb6
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d
        with:
          tool: nextest
          fallback: none
      - name: Configure SDK
        run: |
          SDK_PATH="$(xcrun --show-sdk-path)"
          echo "SDKROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-isystem $SDK_PATH/usr/include/c++/v1" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
      - name: Build render and stealth CLI
        run: cargo build --release -p obscura-cli --bins --features render,stealth
      - name: Focused render and stealth tests
        run: cargo nextest run --release -p obscura-cdp --features render,stealth --test runtime_by_value_undefined --test input_key_event_escaping --no-fail-fast
      - name: Stage artifact
        run: |
          mkdir artifact
          cp target/release/obscura artifact/
          git rev-parse HEAD > artifact/source-commit.txt
          shasum -a 256 artifact/obscura > artifact/obscura.sha256
          artifact/obscura --version
          artifact/obscura fetch 'data:text/html,<title>ok</title>' --stealth --eval '1+1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: obscura-20a3e02-macos-stealth
          path: artifact/
          retention-days: 7

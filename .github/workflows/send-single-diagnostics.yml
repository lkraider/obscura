name: send_single diagnostics
on:
  push:
    branches: [diagnostic/send-single-cause-v0.2.2]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  OPENSSL_NO_VENDOR: "1"
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: h4ckf0r0day/obscura-benchmark
          ref: 6ebac8293d7477f59e837768bfd4e74173f04f1c
          path: obscura-benchmark
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake libclang-dev libssl-dev llvm-dev pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d
        with:
          tool: nextest
          fallback: none
      - if: runner.os == 'macOS'
        run: |
          SDK_PATH="$(xcrun --show-sdk-path)"
          echo "SDKROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-isystem $SDK_PATH/usr/include/c++/v1" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
      - name: Baseline transport suite
        continue-on-error: true
        run: |
          mkdir -p evidence
          git fetch --depth=1 origin 88de58c9c783a40f493c5211524ffdc9adb7ebe6
          git checkout 88de58c9c783a40f493c5211524ffdc9adb7ebe6 -- crates/obscura-net/src/wreq_client.rs
          trap 'git checkout "$GITHUB_SHA" -- crates/obscura-net/src/wreq_client.rs' EXIT
          cargo nextest run --locked --release -p obscura-net --features stealth --no-fail-fast 2>&1 | tee evidence/baseline-net.log
      - name: Focused diagnostic tests
        run: OBSCURA_NET_DIAGNOSTICS=1 cargo nextest run --locked --release -p obscura-net --features stealth -E 'test(diagnostics)' --no-fail-fast 2>&1 | tee evidence/diagnostics.log
      - name: Candidate transport suite
        continue-on-error: true
        run: OBSCURA_NET_DIAGNOSTICS=1 cargo nextest run --locked --release -p obscura-net --features stealth --no-fail-fast 2>&1 | tee evidence/net.log
      - name: Build render and stealth CLI
        run: cargo build --locked --release -p obscura-cli --bins --features render,stealth
      - name: Stage binary
        run: |
          mkdir artifact
          cp target/release/obscura artifact/
          git rev-parse HEAD > artifact/source-commit.txt
          shasum -a 256 artifact/obscura > artifact/obscura.sha256
          artifact/obscura --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: send-single-diagnostics-${{ matrix.os }}
          path: artifact/
          retention-days: 7
      - name: Full render and stealth suite
        continue-on-error: true
        run: cargo nextest run --locked --release --features render,stealth --no-fail-fast 2>&1 | tee evidence/full-render-stealth.log
      - name: Obstacle course
        continue-on-error: true
        run: OBSCURA_BIN="$PWD/target/release/obscura" python3 obscura-benchmark/obstacle-course/run.py --json --runs 1 --warmup 0 > evidence/obstacle.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: send-single-evidence-${{ matrix.os }}
          path: evidence/
          retention-days: 7
